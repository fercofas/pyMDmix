# =============================================================================
# pyMDMix: archivo de configuracion de proyecto (plantilla completa)
#
# Uso:
#   mdmix create project -n NOMBRE -f este_archivo.cfg
#
# Reglas del formato:
#   - Los comentarios van en lineas propias (no al final de una opcion).
#   - Las opciones vacias deben comentarse o eliminarse.
#   - Los nombres de opcion no distinguen mayusculas de minusculas.
# =============================================================================

[SYSTEM]
# Nombre con el que se identifica el sistema (obligatorio)
NAME = Sistema

# Amber Object File (.off) con la unidad del sistema SIN solvatar (obligatorio)
# Si la ruta es relativa, se busca tambien en la carpeta de este archivo.
OFF = sistema.off

# Unidad dentro del .off que contiene el sistema (por defecto, la primera)
#UNAME = SISTEMA

# Residuos no estandar que forman parte del soluto y no del solvente
# (lista separada por comas). Se usan en la deteccion automatica de mascaras.
#EXTRARES = HEM,LIG

# Campos de fuerza o archivos frcmod ADICIONALES para tLeap (lista separada
# por comas). Se cargan despues de los de FF por defecto en md-settings.cfg
# (leaprc.protein.ff19SB y leaprc.gaff2).
# Con cajas de agua OPC es obligatorio incluir leaprc.water.opc.
#EXTRAFF = leaprc.water.opc, ligando.frcmod

[MDSETTINGS]
# ----------------------------- opciones principales --------------------------
# Solventes del proyecto (lista separada por comas, obligatorio)
SOLVENTS = ETA

# Numero de replicas por solvente. Ejemplos: 3   |   ETA:5, WAT:1
NREPL = 5

# Nanosegundos de produccion. Ejemplos: 20   |   ETA:50, WAT:10
NANOS = 20

# Temperatura en K
TEMP = 300

# Restricciones posicionales: FREE (sin restricciones), HA (atomos pesados), BB (esqueleto)
RESTR = HA

# Constante de fuerza de las restricciones, en kcal/mol/A^2 (si RESTR no es FREE)
FORCE = 0.1

# Residuos del soluto que se restringen (por defecto, deteccion automatica).
# Ejemplo: 1-100
#RESTRMASK = auto

# Residuos sobre cuyo esqueleto se alinean las trayectorias (por defecto, igual
# que RESTRMASK). Ejemplo: 1-100,120-240
#ALIGNMASK = auto

# ------------------------ opciones avanzadas (opcionales) --------------------
# Cualquier opcion de md-settings.cfg puede cambiarse aqui. Las mas utiles:

# Programa de dinamica: AMBER, NAMD u OPENMM
#MDPROGRAM = AMBER

# Paso de integracion en fs. Con 4 fs es necesario que la topologia tenga
# reparticion de masa de hidrogenos (HMR); pyMDMix no la aplica por ti.
#MD_TIMESTEP = 2

# Frecuencia de escritura de la trayectoria, en pasos
#TRAJFREQUENCY = 500

# Pasos de cada archivo de calentamiento (eq1 a eq4), de la equilibracion NPT
# (eq5) y de cada archivo de produccion (md). Con 2 fs, 500000 pasos = 1 ns.
#HEATING_STEPS = 100000
#NPT_EQ_STEPS = 500000
#PROD_STEPS = 500000

# Ensamble de produccion: NVT o NPT
#PRODUCTION_ENSEMBLE = NVT

# Reenvolver la caja durante la dinamica (1) o no (0). Con 1 y restricciones,
# pyMDMix genera ademas el script check_com.sh.
#IWRAP = 1
